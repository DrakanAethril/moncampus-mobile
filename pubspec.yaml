name: moncampus_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+2

environment:
  sdk: '>=3.4.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  # Spectral (titles) + Source Sans 3 (text) - the handoff's type system. The .ttf files are
  # bundled under assets/google_fonts/ and runtime fetching is disabled in main(), so the app
  # never depends on fonts.gstatic.com being reachable from a school network.
  google_fonts: ^6.2.1
  # The handoff's icons are lucide-style strokes, not Material glyphs: they are rendered from the
  # exact SVG paths of the creas (lib/theme/app_icons.dart) so stroke width and geometry match.
  flutter_svg: ^2.0.10
  # Magic-link deep links (campusmanager://login/<token>) - screens 6c/6d.
  app_links: ^6.1.4
  # Courrier école attachments: they are served behind the API's Bearer auth, so they are
  # downloaded in-app to a temp file (path_provider) and handed to the OS viewer (open_filex)
  # instead of being opened in an external browser like the travaux' public links.
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  # Listening travaux (design_handoff_enregistrements_audio): the file is streamed straight from its
  # delivery URL, which needs no Bearer header - unlike the Courrier école attachments above, so
  # there is nothing to download to a temp file first. just_audio is used for its position stream,
  # which is what the listen tracking is measured from.
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/brand/
    # Picked up by google_fonts as pre-bundled families (no `fonts:` entry, that is how the
    # package expects them) - see the dependency comment above.
    - assets/google_fonts/
    - assets/icons/moncampus/ic_launcher_48.png
    - assets/icons/moncampus/ic_launcher_72.png
    - assets/icons/moncampus/ic_launcher_96.png
    - assets/icons/moncampus/ic_launcher_144.png
    - assets/icons/moncampus/ic_launcher_192.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# App icon of design_handoff_mobile 4f: navy tile, emblem centred (assets generated from the
# crest of assets/images/campus-badge-white.png in the moncampus repo, the only high-resolution
# copy of it). adaptive_icon_background/foreground/monochrome cover Android 8+ adaptive icons +
# the Android 13+ themed monochrome layer; flutter_launcher_icons also (re)generates the legacy
# mipmap-* fallback PNGs for API <26 from image_path.
#
# The foreground artwork is already sized for the full 108dp canvas - the emblem is half of it,
# so its circumscribed circle lands just inside the 72dp the launcher mask keeps. Hence the
# explicit inset of 0: flutter_launcher_icons 0.14 defaults it to 16%, which shrank the artwork a
# second time and is what made the icon look lost in the middle of its own tile.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/moncampus/ic_launcher_192.png"
  adaptive_icon_background: "#12344D"
  adaptive_icon_foreground: "assets/icons/moncampus/adaptive_foreground_432.png"
  adaptive_icon_monochrome: "assets/icons/moncampus/adaptive_monochrome_432.png"
  adaptive_icon_foreground_inset: 0

# Launch screen of design_handoff_mobile 4f - Android 12+'s native SplashScreen API draws $color +
# $image before the Flutter engine is even up; the app's own first frame (LaunchScreen in main.dart)
# repeats the same navy/medallion/logotype so the transition from system window to Flutter UI is
# seamless.
flutter_native_splash:
  color: "#12344D"
  image: "assets/icons/moncampus/splash_icon.png"
  android_12:
    color: "#12344D"
    image: "assets/icons/moncampus/splash_icon.png"
  android: true
  ios: false
  web: false
